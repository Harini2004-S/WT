
<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>
<style>
body{
    background:#EAF4FC;
    font-family:Arial,sans-serif;
    margin:0;
}
.box{
    width:70%;
    margin:40px auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 0 20px gray;
}
h1{
    text-align:center;
    color:#0F4C81;
    font-size:38px;
}
h2{
    text-align:center;
    color:#1565C0;
}
table{
    margin:auto;
    border-spacing:10px;
    font-size:17px;
}
td{
    padding:8px;
}
td:first-child{
    font-weight:bold;
    color:#0F4C81;
}
.info{
    text-align:center;
    font-size:17px;
    color:#555;
    line-height:1.8;
    margin-top:25px;
}
form{
    width:80%;
    margin:30px auto;
}
label{
    font-weight:bold;
    color:#0F4C81;
}
input,textarea{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}
textarea{
    resize:vertical;
}
button{
    background:#0F4C81;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#0077B6;
}
a{
    display:inline-block;
    margin-top:25px;
    padding:12px 25px;
    background:#0F4C81;
    color:white;
    text-decoration:none;
    border-radius:25px;
}
a:hover{
    background:#0077B6;
}
.center{
    text-align:center;
}
</style>
</head>
<body>
<div class="box">
<h1>Contact Us</h1>
<table>
<tr><td>Name</td><td>Harini</td></tr>
<tr><td>Email</td><td>harini@gmail.com</td></tr>
<tr><td>Phone</td><td>+91 9876543210</td></tr>
<tr><td>Location</td><td>Tamil Nadu, India</td></tr>
</table>
<p class="info">Contact us for more information about our services.</p>
<h2>Send Us a Message</h2>
<form>
<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>
<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>
<label>Your Message</label>
<textarea rows="5" placeholder="Type your message" required></textarea>
<div class="center">
<button type="submit">Send Message</button>
</div>
</form>
<div class="center">
<a href="index.html">Home</a>
</div>
</div>
</body>
</html>
